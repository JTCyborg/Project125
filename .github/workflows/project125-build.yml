name: Project125 build verification

on:
  push:
    branches:
      - neogs-driver-rewrite
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build directory
        shell: powershell
        run: New-Item -ItemType Directory -Force build | Out-Null

      - name: Assemble NeoGS resident firmware, overlays and V1 bootstrap
        shell: powershell
        run: .\tools\sjasmplus.exe neogs_sub\build_firmware.asm

      - name: Package segmented 48 KiB firmware
        shell: powershell
        run: .\tools\pack_neogs_project125.ps1

      - name: Assemble ATM host and TR-DOS disk image
        shell: powershell
        run: .\tools\sjasmplus.exe zx_main\main.asm

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project125-48k-build
          path: |
            disk_A.trd
            neogs_resident.bin
            neogs_overlay68.bin
            neogs_overlay69.bin
            neogs_bootstrap.bin
            zx_main/neoload.bin
            zx_main/neofw.bin
